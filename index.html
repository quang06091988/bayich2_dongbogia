<style>
:root{
  --xanh:#2f5233; --gao:#e9c46a; --kem:#f6f1e4;
  --giay:#fffdf7; --muc:#1f2a20; --mo:#6d7a6e; --vien:#ded5bf;
  --do:#b3261e; --do-nen:#fbe8e6; --do-vien:#ecc3be; --luc:#1e7a3c; --luc-nen:#e4f3e7; --luc-vien:#bddcc6;
  --vang:#8a6d1f; --vang-nen:#fdf3d8; --vang-vien:#e6c56e;
  --bong:0 1px 2px rgba(47,82,51,.05),0 6px 20px rgba(47,82,51,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--kem);color:var(--muc);font-size:15px;line-height:1.5}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}

/* ── đầu trang ── */
.dau-trang{background:var(--xanh);color:var(--kem);padding:calc(14px + env(safe-area-inset-top)) 0 14px}
/* Điện thoại: tiêu đề phụ nằm riêng hàng 2, trải hết chiều ngang — không bị cắt chữ. Máy tính: nằm dưới tiêu đề. */
.dau-trang .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"td tt" "pd pd";align-items:center;column-gap:12px}
.dau-trang h1{grid-area:td;font-size:20px;line-height:1.2;white-space:nowrap}
.dau-trang p{grid-area:pd;margin:3px 0 0;font-size:12.5px;line-height:1.35;color:#c9d8c9}
.trang-thai{grid-area:tt;display:flex;align-items:center;gap:8px}
.trang-thai span{font-size:12px;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:99px;white-space:nowrap}
.nut-tron{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:var(--kem);font-size:18px;cursor:pointer;flex:none}
.nut-tron.quay{animation:quay .8s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}
@media (max-width:420px){.dau-trang h1{font-size:18px}.trang-thai span{font-size:11px;padding:4px 9px}}

main{padding-top:14px}

/* ── nút ── */
.nut{border:none;border-radius:12px;padding:12px 20px;min-height:46px;font-weight:600;cursor:pointer;background:var(--xanh);color:var(--kem);transition:transform .08s,filter .15s,opacity .15s}
.nut:disabled{opacity:.45;cursor:not-allowed}
.nut.phu{background:#fff;color:var(--xanh);border:1.5px solid var(--vien)}
.nut:not(:disabled):active,.nut-tron:active{transform:scale(.96)}
@media (hover:hover){.nut:not(:disabled):hover{filter:brightness(1.07)}}
:focus-visible{outline:2.5px solid var(--gao);outline-offset:2px}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;line-height:1.6;white-space:nowrap}
.chip.do{background:var(--do);color:#fff}
.chip.xanh{background:var(--luc);color:#fff}

.canh{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:12px;background:var(--vang-nen);border:1px solid var(--vang-vien)}
/* khung Mã PIN chung — hỏi một lần trên máy này, trước lần ghi đầu tiên */
.che-pin{position:fixed;inset:0;z-index:70;background:rgba(24,34,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.che-pin[hidden]{display:none}
.hop-pin{width:100%;max-width:380px;background:#fffdf7;border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.hop-pin h2{font-size:18px;margin:0 0 4px}
.hop-pin p{margin:0 0 12px;font-size:13.5px;color:#6d7a6e}
.hop-pin input{width:100%;min-height:48px;border:1.5px solid #ded5bf;border-radius:10px;padding:8px 12px;font-size:22px;letter-spacing:.3em;text-align:center;background:#fff}
.hop-pin input:focus{outline:none;border-color:#2f5233;box-shadow:0 0 0 3px rgba(47,82,51,.12)}
.hop-pin .loi-pin{color:#b3261e;font-weight:600;min-height:1.3em;margin:8px 0}
.hang-nut-pin{display:flex;gap:10px;justify-content:flex-end}
.canh.loi{background:var(--do-nen);border-color:#ecbdb8}
.canh.ok{background:var(--luc-nen);border-color:#b3d8bf}
.canh b{display:block;margin-bottom:2px}
.canh ul{margin:6px 0 0;padding-left:18px}
.canh summary{cursor:pointer;font-weight:600}
.canh .nut{margin-top:8px;min-height:38px;padding:7px 14px;font-size:14px}

/* ── tóm tắt ── */
.tom-tat{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-bottom:14px}   /* 4 hoặc 5 ô — tự chia đều */
.o-tt{background:var(--giay);border:1px solid var(--vien);border-radius:12px;padding:8px 6px;text-align:center}
.o-tt b{display:block;font-family:'Fraunces',serif;font-size:20px;line-height:1.15}
.o-tt span{display:block;font-size:10.5px;line-height:1.25;color:var(--mo)}
.o-tt.do b{color:var(--do)}.o-tt.xanh b{color:var(--luc)}.o-tt.vang b{color:var(--vang)}
.o-tt.rong{opacity:.5}

/* ── danh sách món ── */
.nhom{margin-bottom:18px}
.nhom h2{font-size:17px;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
.nhom h2 small{font-family:'Be Vietnam Pro',sans-serif;font-size:12.5px;font-weight:500;color:var(--mo)}
.mon-dau{display:none}
.mon{display:grid;grid-template-columns:36px 1fr;gap:8px 12px;align-items:center;padding:14px;margin-bottom:10px;
  background:var(--giay);border:1px solid var(--vien);border-radius:16px;transition:opacity .15s,border-color .15s,background .15s}
.mon.do{background:var(--do-nen);border-color:var(--do-vien)}
.mon.xanh{background:var(--luc-nen);border-color:var(--luc-vien)}
.mon.can-xem{border:2px solid var(--vang-vien)}
.mon.bo{opacity:.6}
.tich{position:relative;width:30px;height:30px;cursor:pointer;align-self:start}
.tich input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tich span{position:absolute;inset:0;border:2px solid #b8b09c;border-radius:9px;background:#fff;transition:background .12s,border-color .12s,transform .1s}
.tich input:checked+span{background:var(--xanh);border-color:var(--xanh)}
.tich input:checked+span::after{content:'';position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tich input:active+span{transform:scale(.9)}
.tich input:focus-visible+span{outline:2.5px solid var(--gao);outline-offset:2px}
.mon-ten b{display:block;font-size:15px;line-height:1.3}
.nguon{display:block;font-size:12px;color:var(--mo);margin-top:2px}
.hang-gia{grid-column:2;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px}
.o-gia > span{display:block;font-size:11.5px;color:var(--mo)}
.cap{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.cu{color:var(--mo);text-decoration:line-through;font-size:12.5px}
.moi{font-weight:700}
.mon.do .o-gia.doi .moi{color:var(--do)}
.mon.xanh .o-gia.doi .moi{color:var(--luc)}
.hang-gia .chip{margin-left:auto}
.canh-nho{grid-column:2;font-size:12.5px;color:var(--vang);font-weight:600}

details.gap{background:var(--giay);border:1px solid var(--vien);border-radius:14px;margin-bottom:10px}
details.gap summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.gap summary::-webkit-details-marker{display:none}
details.gap summary::before{content:'›';font-size:20px;line-height:1;transition:transform .15s;color:var(--mo)}
details.gap[open] summary::before{transform:rotate(90deg)}
.dong-gon{display:flex;gap:10px;padding:9px 16px;border-top:1px solid #eee6d4;font-size:14px}
.dong-gon .phai{margin-left:auto;color:var(--mo);font-variant-numeric:tabular-nums;white-space:nowrap}
.dong-gon i{font-style:normal;font-size:12px;color:var(--mo)}

/* ── màn xong ── */
.the{background:var(--giay);border:1px solid var(--vien);border-radius:16px;box-shadow:var(--bong);overflow:hidden}
.xong{text-align:center;padding:26px 16px 10px}
.dau-tich{width:64px;height:64px;border-radius:50%;background:var(--luc);color:#fff;font-size:34px;line-height:64px;margin:0 auto 12px;animation:bat .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bat{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.xong h2{font-size:21px}
.xong p{margin:4px 0 0;color:var(--mo)}
.ds-kq{margin:14px 0 0;padding:0;list-style:none}
.ds-kq li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #eee6d4;font-size:14px}
.ds-kq li.tieu-de{font-weight:700;font-size:13px;color:var(--mo);background:#faf6ea}
.ds-kq .cham{width:10px;height:10px;border-radius:50%;flex:none}
.ds-kq .cham.do{background:var(--do)}.ds-kq .cham.xanh{background:var(--luc)}
.ds-kq .phai{margin-left:auto;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.hang-nut{padding:16px;display:flex;justify-content:center}

/* ── chuyển màn ── */
.man.vao-phai{animation:tuPhai .24s ease}
.man.vao-trai{animation:tuTrai .24s ease}
@keyframes tuPhai{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes tuTrai{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.khung-xuong{height:84px;border-radius:16px;margin-bottom:10px;background:linear-gradient(100deg,#efe8d6 30%,#f7f2e6 50%,#efe8d6 70%);background-size:200% 100%;animation:song 1.2s infinite}
@keyframes song{from{background-position:200% 0}to{background-position:-200% 0}}

/* ── thanh dưới ── */
.thanh-duoi{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,247,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--vien);padding:10px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(47,82,51,.08)}
.thanh-duoi .wrap{display:flex;align-items:center;gap:12px}
.thanh-duoi .tt{flex:1;font-size:13.5px;color:var(--mo);min-width:0}
.thanh-duoi .tt b{color:var(--muc)}

.bao{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,12px);background:var(--muc);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
.bao.hien{opacity:1;transform:translate(-50%,0)}

/* ══ MÁY TÍNH ══ */
@media (min-width:760px){
  .wrap{padding:0 20px}
  .dau-trang .wrap{grid-template-areas:"td tt" "pd tt"}
  .dau-trang h1{font-size:23px;align-self:end}
  .dau-trang p{align-self:start;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding-top:20px}
  .mon-dau,.mon{grid-template-columns:36px minmax(0,1fr) repeat(var(--k),150px) 150px}
  .mon-dau{display:grid;gap:12px;padding:0 16px 6px;font-size:12px;color:var(--mo);font-weight:600}
  .mon-dau span:nth-child(n+3){text-align:right}
  .mon{padding:10px 16px;margin-bottom:6px;border-radius:12px}
  .hang-gia{display:contents}
  .o-gia{text-align:right}
  .o-gia > span{display:none}
  .cap{justify-content:flex-end}
  .hang-gia .chip{justify-self:end;margin-left:0}
  .canh-nho{grid-column:2/-1}
  .bao{bottom:92px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="dau-trang">
  <div class="wrap">
    <h1>Đồng bộ giá</h1>
    <p>Retail → Menu Bảy Ích 2</p>
    <div class="trang-thai">
      <span id="tt">Đang tải…</span>
      <button class="nut-tron" id="nut-tai" aria-label="Tính lại từ giá mới nhất" title="Tính lại từ giá mới nhất">↻</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="tb-loi"></div>

  <!-- MÀN 1 — kiểm tra -->
  <section class="man" id="man1">
    <div id="tb-dl"></div>
    <div class="tom-tat" id="tom-tat"></div>
    <div id="tb-ghi"></div>
    <div id="ds"><div class="khung-xuong"></div><div class="khung-xuong"></div><div class="khung-xuong"></div></div>
  </section>

  <!-- MÀN 2 — xong -->
  <section class="man" id="man2" hidden>
    <div class="the" id="ket-qua"></div>
  </section>
</main>

<div class="thanh-duoi" id="thanh-duoi" hidden>
  <div class="wrap">
    <div class="tt" id="tt-duoi"></div>
    <button class="nut" id="nut-ghi">Ghi</button>
  </div>
</div>

<!-- Mã PIN chung — hỏi một lần trên máy này, trước lần ghi đầu tiên -->
<div class="che-pin" id="hop-pin" hidden>
  <div class="hop-pin" role="dialog" aria-modal="true" aria-labelledby="td-pin">
    <h2 id="td-pin">Nhập Mã PIN chung</h2>
    <p>Cần một lần trên máy này để xem và ghi giá. Xem ô "Mã PIN chung" ở tab CauHinh trong Google Sheet bayich2.</p>
    <input id="o-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Mã PIN chung">
    <p class="loi-pin" id="loi-pin" role="alert"></p>
    <div class="hang-nut-pin"><button class="nut phu" id="huy-pin">Huỷ</button><button class="nut" id="nut-pin">Xác nhận</button></div>
  </div>
</div>

<div class="bao" id="bao" role="status" aria-live="polite"></div>

<script>
/* ══════════════════════════════════════════════════════════
   Ánh xạ tên nằm trong tab DongBo; bước làm tròn, ngưỡng cảnh báo, màu… nằm trong tab CauHinh (sheet bayich2)
   và được máy chủ tính sẵn. Trong code chỉ còn link Apps Script và tên hiển thị 2 tiệm.
   ══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbz767Ti7iftH6thPYqdMfr7YqDnT4ntOwZT5vMj9Ox7T6v4FCJwrrWsx8FLtp0JQfVy/exec';
const TEN_DICH = { Menu: 'Bảy Ích 2 · Menu' };   // đã ngừng đồng bộ SanPham (Vân Bao Bì) từ 2026-09-16

/* ══════════════════ tiện ích ══════════════════ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const dinh = n => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('vi-VN');
const thoat = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const giamChuyenDong = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const rung = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const ngu = ms => new Promise(r => setTimeout(r, ms));
const khoaMon = m => m.dich + '|' + m.ten;

let hgBao;
function bao(msg) { const b = $('#bao'); b.textContent = msg; b.classList.add('hien'); clearTimeout(hgBao); hgBao = setTimeout(() => b.classList.remove('hien'), 2600); }
function chuaCho() { const t = $('#thanh-duoi'); document.body.style.paddingBottom = (t.hidden ? 24 : t.getBoundingClientRect().height + 24) + 'px'; }
addEventListener('resize', chuaCho);

/* ── gọi Apps Script ──
   Google thỉnh thoảng trả trang "không thể mở tệp" (404) ở bước chuyển hướng dù script ĐÃ CHẠY XONG.
   Đọc thì thử lại; ghi thì không gửi lại mà đọc lại để xác minh (xacMinhSauLoi). */
class LoiDuongTruyen extends Error {}
function bocChu(t) {
  try { const d = new DOMParser().parseFromString(t, 'text/html'); d.querySelectorAll('script,style,noscript').forEach(n => n.remove()); return (d.body ? d.body.textContent : '').replace(/\s+/g, ' ').trim(); }
  catch { return ''; }
}
function chuanDoan(t) {
  const s = (bocChu(t) + ' ' + t).toLowerCase();
  if (s.includes('accounts.google.com') || s.includes('servicelogin') || s.includes('sign in')) return 'Google đang bắt đăng nhập — bản triển khai chưa mở cho "Bất kỳ ai".';
  if (s.includes('you need permission') || s.includes('không có quyền')) return 'Apps Script chưa đủ quyền chạy.';
  if (s.includes('script function not found')) return 'Bản triển khai đang chạy code cũ — cần tạo phiên bản mới.';
  if (s.includes('không thể mở tệp') || s.includes('unable to open the file')) return 'Google tạm thời không phản hồi (lỗi phía Google).';
  if (s.includes('<!doctype') || s.includes('<html')) return 'Apps Script trả về trang lỗi thay vì dữ liệu.';
  return '';
}
async function docJSON(r) {
  const t = await r.text();
  try { return JSON.parse(t); }
  catch { throw new LoiDuongTruyen(chuanDoan(t) || 'Apps Script trả về nội dung lạ.'); }
}
/* Đợt trục trặc của Google có thể kéo dài vài giây: thử THU.lan lần, nghỉ tăng dần (1s, 2s, 3s, 4s).
   JSON sai dạng (phản hồi lạc, vd kiểu ping) cũng tính là thất bại. Hết lượt thì tự thử lại sau tuThuLaiMs. */
const THU = { lan: 5, nghiMs: 1000, choMs: 25000, tuThuLaiMs: 15000, toiDaTuThu: 20 };
/* Một lần đọc quá THU.choMs thì bỏ, tính là thất bại để thử lại — lúc Google kẹt, gọi lại thường nhanh hơn chờ tiếp.
   Chỉ dùng cho ĐỌC: lệnh ghi bỏ ngang thì script vẫn có thể đang ghi, nên ghi luôn chờ tới khi có trả lời. */
/* Xem trước = POST có Mã PIN trong nội dung gửi (không đưa PIN lên link). Lệnh đọc không đổi dữ liệu nên thử lại thoải mái. */
async function docCoHan(api, body) {
  const ctl = new AbortController(), hg = setTimeout(() => ctl.abort(), THU.choMs);
  try { return await docJSON(await fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal })); }
  catch (e) { throw ctl.signal.aborted ? new LoiDuongTruyen(`Google không trả lời sau ${THU.choMs / 1000} giây.`) : e; }
  finally { clearTimeout(hg); }
}
async function layDuLieu(baoTienDo) {
  let loi;
  for (let lan = 1; lan <= THU.lan; lan++) {
    if (lan > 1) { baoTienDo && baoTienDo(lan); await ngu((lan - 1) * THU.nghiMs); }
    try {
      const j = await docCoHan(API, { hanhDong: 'xemTruoc', pin: docPin() });
      if (j && j.ok === false) return j;                          // lỗi thật từ máy chủ — không thử lại
      if (j && Array.isArray(j.mon)) return j;
      loi = new LoiDuongTruyen('Google trả về dữ liệu không đúng dạng.');
    } catch (e) { loi = e instanceof LoiDuongTruyen ? e : new LoiDuongTruyen('Mất kết nối tới Apps Script. Kiểm tra mạng rồi thử lại.'); }
  }
  throw loi;
}
async function goi(payload) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); }
  catch { throw new LoiDuongTruyen('Mất kết nối tới Apps Script.'); }
  return docJSON(r);
}

/* ── Mã PIN chung (tab CauHinh) — cần để XEM và GHI giá. Nhập một lần, lưu trong máy này. ── */
const KHOA_PIN = 'b2_pin';
const docPin = () => { try { return localStorage.getItem(KHOA_PIN) || ''; } catch { return ''; } };
const luuPin = p => { try { p ? localStorage.setItem(KHOA_PIN, p) : localStorage.removeItem(KHOA_PIN); } catch {} };
/* Có PIN rồi thì trả ngay; chưa có thì mở khung nhập, kiểm với máy chủ (lệnh kiemPin) — đúng mới lưu. Huỷ → null. */
function hoiPin() {
  const co = docPin();
  if (co) return Promise.resolve(co);
  const hop = $('#hop-pin'), o = $('#o-pin'), bao = $('#loi-pin'), nut = $('#nut-pin');
  if (!hop.hidden) return Promise.resolve(null);
  return new Promise(res => {
    o.value = ''; bao.textContent = ''; hop.hidden = false; setTimeout(() => o.focus(), 60);
    const xong = v => { hop.hidden = true; nut.onclick = $('#huy-pin').onclick = o.onkeydown = null; res(v); };
    const thu = async () => {
      const pin = o.value.trim();
      if (!pin) { bao.textContent = 'Nhập Mã PIN chung.'; return; }
      nut.disabled = true; nut.textContent = 'Đang kiểm tra…'; bao.textContent = '';
      try {
        const r = await goi({ hanhDong: 'kiemPin', pin });
        if (r && r.ok) { luuPin(pin); xong(pin); }
        else bao.textContent = (r && r.loi) || 'Sai mã PIN.';
      } catch (e) { bao.textContent = 'Chưa kiểm tra được (' + e.message + ') — thử lại.'; }
      finally { nut.disabled = false; nut.textContent = 'Xác nhận'; }
    };
    nut.onclick = thu; $('#huy-pin').onclick = () => xong(null);
    o.onkeydown = e => { if (e.key === 'Enter') thu(); if (e.key === 'Escape') xong(null); };
  });
}

/* ══════════════════ dữ liệu ══════════════════ */
let DL = null;          // {mon, canhBao, nguongNhay, thoiGian}
let CHON = new Set();   // khoá "dich|ten" các món đang tích
let man = 1, dangGhi = false, lanTai = 0, lucTai = 0;   // lucTai: lúc tính được gần nhất

const coDoi = m => m.trangThai === 'do' || m.trangThai === 'xanh';
const canXem = m => coDoi(m) && DL.nguongNhay && m.nhay * 100 >= DL.nguongNhay;
const oCuaMon = m => Object.entries(m.gia).filter(([, g]) => g.doi).map(([cot, g]) => ({ dich: m.dich, ten: m.ten, cot, cu: g.cu, moi: g.moi }));
const monDaChon = () => (DL?.mon || []).filter(m => coDoi(m) && CHON.has(khoaMon(m)));

let hgTuThu = null, soLanTuThu = 0;
/* Xem giá cần Mã PIN chung: chưa có thì hỏi trước; huỷ thì không tải gì */
function canPin() {
  $('#tt').textContent = 'Chưa có PIN';
  $('#tb-loi').innerHTML = '<div class="canh"><b>Cần Mã PIN chung để xem giá</b>Xem ô "Mã PIN chung" ở tab CauHinh trong Google Sheet bayich2.<br><button class="nut" data-thu-lai>Nhập PIN</button></div>';
}
async function napDuLieu(chonLai = true) {
  if (!docPin() && !(await hoiPin())) { canPin(); return false; }
  const lan = ++lanTai, nut = $('#nut-tai');
  nut.classList.add('quay');
  clearInterval(hgTuThu);
  try {
    const j = await layDuLieu(n => { if (lan === lanTai) $('#tt').textContent = `Google chậm — thử lại ${n}/${THU.lan}…`; });
    if (!j.ok && j.maLoi === 'PIN') { luuPin(''); if (lan === lanTai) setTimeout(() => napDuLieu(chonLai), 0); return false; }   // PIN đã đổi → hỏi lại
    if (!j.ok) throw new Error(j.loi || 'Apps Script báo lỗi.');
    if (lan !== lanTai) return false;
    soLanTuThu = 0; lucTai = Date.now();
    /* chonLai=false: món đã thấy từ trước giữ đúng như đang tích; món mới xuất hiện thì tích theo mặc định */
    const cu = CHON, daThay = new Set((DL?.mon || []).filter(coDoi).map(khoaMon));
    DL = j;
    CHON = new Set(j.mon.filter(m => coDoi(m) && ((chonLai || !daThay.has(khoaMon(m))) ? !canXem(m) : cu.has(khoaMon(m)))).map(khoaMon));
    $('#tb-loi').innerHTML = '';
    $('#tt').textContent = 'Tính lúc ' + new Date(j.thoiGian).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    ve();
    return true;
  } catch (e) {
    if (lan !== lanTai) return false;
    $('#tt').textContent = 'Chưa tải được';
    if (!DL) $('#ds').innerHTML = '';
    if (e instanceof LoiDuongTruyen && soLanTuThu < THU.toiDaTuThu) henTuThuLai(e.message);
    else $('#tb-loi').innerHTML = `<div class="canh loi"><b>Không tính được thay đổi</b>${thoat(e.message)}<br><button class="nut" data-thu-lai>Thử lại</button></div>`;
    capNhatThanh();
    return false;
  } finally {
    if (lan === lanTai) nut.classList.remove('quay');
  }
}
/* Google đang trục trặc: đếm ngược rồi tự tính lại (tạm dừng khi tab bị ẩn). */
function henTuThuLai(lyDo) {
  soLanTuThu++;
  let con = Math.round(THU.tuThuLaiMs / 1000);
  const ve = () => { $('#tb-loi').innerHTML = `<div class="canh"><b>Google đang trục trặc — tự thử lại sau ${con}s</b>${thoat(lyDo)}<br><button class="nut" data-thu-lai>Thử lại ngay</button></div>`; };
  ve();
  clearInterval(hgTuThu);
  hgTuThu = setInterval(() => {
    if (document.hidden) return;
    if (--con <= 0) { clearInterval(hgTuThu); napDuLieu(!DL).then(ok => { if (ok) bao('Đã tính được thay đổi'); }); }
    else ve();
  }, 1000);
}

/* Để trang mở rồi quay lại (vd sau khi ghi toa ở trang Đối chiếu): số đã cũ → tự tính lại, giữ các món đang tích. */
const CU_MS = 60e3;
function tinhLaiNeuCu() {
  if (document.hidden || man !== 1 || dangGhi || !DL || Date.now() - lucTai < CU_MS) return;
  napDuLieu(false).then(ok => { if (ok) bao('Đã tính lại theo giá mới nhất'); });
}
document.addEventListener('visibilitychange', tinhLaiNeuCu);
addEventListener('pageshow', e => { if (e.persisted) tinhLaiNeuCu(); });

/* ══════════════════ MÀN 1 — kiểm tra ══════════════════ */
/* Viết giống cột Nguồn trong tab DongBo: "= A + B", "= Bị Ngang Lớn ÷ 2" */
function chuNguon(m) {
  const n = 1 / m.heSo;
  const pt = m.heSo === 1 ? '' : Math.abs(n - Math.round(n)) < 1e-9 ? ' ÷ ' + Math.round(n) : ' × ' + String(m.heSo).replace('.', ',');
  if (m.nguon.length > 1 || pt) return '= ' + m.nguon.join(' + ') + pt;
  return m.nguon[0] !== m.ten ? '← ' + m.nguon[0] : '';
}
function htmlMon(m) {
  const k = khoaMon(m), chon = CHON.has(k), xem = canXem(m), n = chuNguon(m);
  return `<div class="mon ${m.trangThai}${xem ? ' can-xem' : ''}${chon ? '' : ' bo'}">
    <label class="tich"><input type="checkbox" data-chon="${thoat(k)}" ${chon ? 'checked' : ''} aria-label="Ghi ${thoat(m.ten)}"><span></span></label>
    <div class="mon-ten"><b>${thoat(m.ten)}</b>${n ? `<span class="nguon">${thoat(n)}</span>` : ''}</div>
    <div class="hang-gia">
      ${Object.entries(m.gia).map(([cot, g]) => `<div class="o-gia${g.doi ? ' doi' : ''}"><span>${thoat(cot)}</span>
        <div class="cap">${g.doi ? `<span class="cu">${dinh(g.cu)}</span>` : ''}<span class="moi">${dinh(g.moi)}</span></div></div>`).join('')}
      <span class="chip ${m.trangThai}">${m.trangThai === 'do' ? 'Đổi giá bán' : 'Chỉ đổi giá sỉ'}</span>
    </div>
    ${xem ? `<div class="canh-nho">⚠ Giá đổi ${Math.round(m.nhay * 100)}% — kiểm tra lại Retail trước khi ghi</div>` : ''}
  </div>`;
}
function ve() {
  const mon = DL.mon, loi = DL.canhBao.filter(c => c.loai === 'loi'), luuY = DL.canhBao.filter(c => c.loai !== 'loi');
  const dem = t => mon.filter(m => m.trangThai === t).length;
  const o = (so, chu, lop) => `<div class="o-tt ${lop}${so ? '' : ' rong'}"><b>${so}</b><span>${chu}</span></div>`;
  $('#tom-tat').innerHTML = o(dem('do'), 'Đổi giá bán', 'do') + (dem('xanh') ? o(dem('xanh'), 'Chỉ đổi giá sỉ', 'xanh') : '')
    + o(mon.filter(canXem).length, 'Cần xem lại', 'vang') + o(dem('giu'), 'Đã khớp', '') + o(loi.length, 'Lỗi ánh xạ', loi.length ? 'do' : '');

  $('#tb-dl').innerHTML =
    (loi.length ? `<details class="canh loi" open><summary>${loi.length} dòng không đồng bộ được — sửa trong tab DongBo</summary><ul>${loi.map(x => `<li>${thoat(x.noiDung)}</li>`).join('')}</ul></details>` : '')
    + (luuY.length ? `<details class="canh"><summary>${luuY.length} lưu ý</summary><ul>${luuY.map(x => `<li>${thoat(x.noiDung)}</li>`).join('')}</ul></details>` : '');

  let h = '';
  for (const dich of Object.keys(TEN_DICH)) {
    const ds = mon.filter(m => m.dich === dich && coDoi(m));
    if (!ds.length) continue;
    const cot = Object.keys(ds[0].gia);
    h += `<section class="nhom" style="--k:${cot.length}"><h2>${thoat(TEN_DICH[dich])} <small>${ds.length} món đổi</small></h2>
      <div class="mon-dau"><span></span><span>Món</span>${cot.map(c => `<span>${thoat(c)}</span>`).join('')}<span></span></div>
      ${ds.map(htmlMon).join('')}</section>`;
  }
  const giu = mon.filter(m => m.trangThai === 'giu');
  if (!h && !loi.length) h = '<div class="canh ok"><b>Tất cả đã khớp với Retail</b>Menu Bảy Ích 2 đang đúng giá — không cần ghi gì.</div>';
  if (giu.length) h += `<details class="gap"><summary>Đã khớp (${giu.length})</summary>${giu.map(m =>
    `<div class="dong-gon"><span>${thoat(m.ten)} <i>${thoat(TEN_DICH[m.dich] || m.dich)}</i></span><span class="phai">${Object.values(m.gia).map(g => dinh(g.moi)).join(' · ')}</span></div>`).join('')}</details>`;
  $('#ds').innerHTML = h;
  capNhatThanh();
}

$('#ds').addEventListener('change', e => {
  const el = e.target; if (el.dataset.chon === undefined) return;
  el.checked ? CHON.add(el.dataset.chon) : CHON.delete(el.dataset.chon);
  el.closest('.mon').classList.toggle('bo', !el.checked);
  rung(8); capNhatThanh();
});

function capNhatThanh() {
  const thanh = $('#thanh-duoi'), nut = $('#nut-ghi');
  const coGhi = man === 1 && DL && DL.mon.some(coDoi);
  thanh.hidden = !coGhi;
  if (coGhi) {
    const ds = monDaChon(), soO = ds.reduce((s, m) => s + oCuaMon(m).length, 0);
    $('#tt-duoi').innerHTML = ds.length ? `<b>${ds.length}</b> món · ${soO} ô giá` : 'Chưa chọn món nào';
    nut.textContent = dangGhi ? 'Đang ghi…' : `Ghi ${ds.length || ''} món`.replace('  ', ' ');
    nut.disabled = !ds.length || dangGhi;
  }
  chuaCho();
}

/* ══════════════════ ghi ══════════════════ */
async function ghi() {
  const ds = monDaChon();
  if (!ds.length || dangGhi) return;
  const pin = await hoiPin(); if (!pin) return;   // lệnh ghi cần Mã PIN chung — nhập một lần trên máy này
  const chon = ds.flatMap(oCuaMon);
  dangGhi = true; capNhatThanh();
  $('#tb-ghi').innerHTML = '';
  let r;
  try {
    try {
      r = await goi({ hanhDong: 'dongBo', chon, pin });
      /* ok mà không có danh sách đã ghi = phản hồi lạc, không phải của lệnh ghi này → xác minh như lỗi đường truyền */
      if (!r || typeof r !== 'object' || (r.ok && !Array.isArray(r.daGhi))) throw new LoiDuongTruyen('Google trả về phản hồi không đúng dạng.');
    } catch (e) { if (!(e instanceof LoiDuongTruyen)) throw e; r = await xacMinhSauLoi(ds, chon, e); }
    if (r.xemTruoc?.ok) DL = r.xemTruoc;
    if (!r.ok) { if (r.maLoi === 'PIN') luuPin(''); const e = new Error(r.loi || 'Apps Script báo lỗi.'); e.boQua = r.boQua; throw e; }   // PIN đã đổi → lần bấm sau hỏi lại
  } catch (e) {
    if (e.xemTruoc) DL = e.xemTruoc;
    if (DL) { CHON = new Set([...CHON].filter(k => DL.mon.some(m => khoaMon(m) === k && coDoi(m)))); ve(); }
    const bq = (e.boQua || []).map(x => `<li>${thoat(x.ten)}${x.cot ? ' · ' + thoat(x.cot) : ''}: ${thoat(x.lyDo)}</li>`).join('');
    $('#tb-ghi').innerHTML = `<div class="canh loi"><b>Chưa ghi xong</b>${thoat(e.message)}${bq ? `<ul>${bq}</ul>` : ''}<br><button class="nut" data-so-lai>Tính lại</button></div>`;
    $('#tb-ghi').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  } finally {
    dangGhi = false; capNhatThanh();
  }
  /* Đến đây là ĐÃ ghi xong — lỗi khi vẽ màn kết quả không bao giờ được báo thành "chưa ghi" */
  try { rung([20, 50, 20]); veKetQua(r); }
  catch (e) {
    $('#ket-qua').innerHTML = `<div class="xong"><div class="dau-tich">✓</div><h2>Đã cập nhật</h2><p>Không hiển thị được chi tiết (${thoat(e.message)}).</p></div>
      <div class="hang-nut"><button class="nut phu" id="nut-lai">Kiểm tra lại</button></div>`;
  }
  sangMan(2);
}
/* Không nhận được trả lời hợp lệ: đọc lại, ô nào đã mang giá mới là đã ghi. KHÔNG gửi lại lệnh ghi. */
async function xacMinhSauLoi(ds, chon, loiGoc) {
  $('#nut-ghi').textContent = 'Đang kiểm tra lại…';
  let j;
  try { j = await layDuLieu(); } catch {}
  if (!j?.ok || !Array.isArray(j.mon)) throw new Error(loiGoc.message + ' Chưa kiểm tra lại được — bấm "Tính lại" để biết đã ghi chưa.');
  const hienTai = new Map(j.mon.map(m => [khoaMon(m), m]));
  const vao = chon.filter(c => hienTai.get(c.dich + '|' + c.ten)?.gia[c.cot]?.cu === c.moi);
  if (vao.length === chon.length) {
    const daGhi = ds.map(m => ({ dich: m.dich, ten: m.ten, mau: m.trangThai, gia: Object.fromEntries(oCuaMon(m).map(c => [c.cot, { cu: c.cu, moi: c.moi }])) }));
    return { ok: true, xacMinh: true, daGhi, boQua: [], xemTruoc: j, soDo: daGhi.filter(x => x.mau === 'do').length, soXanh: daGhi.filter(x => x.mau === 'xanh').length };
  }
  const e = new Error(`${loiGoc.message} Đã kiểm tra lại: ${vao.length}/${chon.length} ô giá đã được ghi.`);
  e.xemTruoc = j;
  e.boQua = chon.filter(c => !vao.includes(c)).map(c => ({ ten: c.ten, cot: c.cot, lyDo: 'Chưa ghi — tích lại và ghi lần nữa' }));
  throw e;
}

/* ══════════════════ MÀN 2 — xong ══════════════════ */
function veKetQua(r) {
  let ds = '';
  for (const dich of Object.keys(TEN_DICH)) {
    const nhom = (r.daGhi || []).filter(x => x.dich === dich);
    if (!nhom.length) continue;
    ds += `<li class="tieu-de">${thoat(TEN_DICH[dich])}</li>` + nhom.map(x => `<li><span class="cham ${x.mau}"></span><span>${thoat(x.ten)}</span>
      <span class="phai">${Object.entries(x.gia).map(([cot, g]) => `${thoat(cot)}: <span class="cu">${dinh(g.cu)}</span> → <b>${dinh(g.moi)}</b>`).join('<br>')}</span></li>`).join('');
  }
  $('#ket-qua').innerHTML = `
    <div class="xong"><div class="dau-tich">✓</div><h2>Đã cập nhật ${(r.daGhi || []).length} món</h2>
      <p>${r.soDo} đổi giá bán${r.soXanh ? ` · ${r.soXanh} chỉ đổi giá sỉ` : ''} — đã tô màu trong Sheet</p>
      ${r.xacMinh ? '<p style="font-size:12.5px">Google báo lỗi đường truyền nhưng đã kiểm tra lại: dữ liệu đã vào Sheet.</p>' : ''}</div>
    <ul class="ds-kq">${ds}</ul>
    ${r.boQua?.length ? `<div style="padding:12px 16px 0"><div class="canh"><b>Bỏ qua ${r.boQua.length} ô</b><ul>${r.boQua.map(x => `<li>${thoat(x.ten)} · ${thoat(x.cot)}: ${thoat(x.lyDo)}</li>`).join('')}</ul></div></div>` : ''}
    <div class="hang-nut"><button class="nut phu" id="nut-lai">Kiểm tra lại</button></div>`;
}

/* ══════════════════ điều hướng ══════════════════ */
function sangMan(m) {
  const cu = man; man = m;
  $$('.man').forEach(s => {
    const la = s.id === 'man' + m;
    s.hidden = !la;
    if (la && cu !== m) { s.classList.remove('vao-phai', 'vao-trai'); void s.offsetWidth; s.classList.add(m > cu ? 'vao-phai' : 'vao-trai'); }
  });
  if (m === 2) history.pushState({ man: 2 }, '');
  scrollTo({ top: 0, behavior: giamChuyenDong() ? 'auto' : 'smooth' });
  capNhatThanh();
}
function veMan1() { sangMan(1); napDuLieu(); }
addEventListener('popstate', () => { if (man !== 1) veMan1(); });   // nút Back của điện thoại

$('#nut-ghi').addEventListener('click', ghi);
$('#nut-tai').addEventListener('click', async () => { if (man !== 1) sangMan(1); if (await napDuLieu()) bao('Đã tính lại theo giá mới nhất'); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-thu-lai]')) napDuLieu();
  if (e.target.closest('[data-so-lai]')) { $('#tb-ghi').innerHTML = ''; napDuLieu(false); }
  if (e.target.closest('#nut-lai')) { if (history.state?.man) history.back(); else veMan1(); }
});

napDuLieu();
</script>
</body>
</html>
